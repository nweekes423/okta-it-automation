name: Okta User Audit

on:
  schedule:
    # Run weekdays at 2 PM UTC
    - cron: '0 14 * * 1-5'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Run Okta audit
        env:
          OKTA_ORG_URL: ${{ secrets.OKTA_ORG_URL }}
          OKTA_API_TOKEN: ${{ secrets.OKTA_API_TOKEN }}
        run: python okta_audit.py --stale-days 30 --output okta_audit.csv

      - name: Upload audit CSV as artifact
        uses: actions/upload-artifact@v4
        with:
          name: okta-audit
          path: okta_audit.csv
          retention-days: 7
